<h1>Grabbo 1.1.0</h1>
<p>Grabbo is a bookmarklet for Safari and Chrome. It shows the best-quality version of every image on a web page, largest first.</p>
<h2>Install</h2>
<p>Drag the "Grabbo" link to your bookmarks bar. Open any web page and click it.</p>
